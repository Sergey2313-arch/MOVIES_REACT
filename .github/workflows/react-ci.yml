name: React CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --silent --no-audit --no-fund

      - name: Build
        shell: bash
        run: |
          if ! npm run build > build.log 2>&1; then
            echo "::group::Build error"
            tail -n 80 build.log
            echo "::endgroup::"
            exit 1
          fi
          tail -n 20 build.log
        env:
          CI: false
